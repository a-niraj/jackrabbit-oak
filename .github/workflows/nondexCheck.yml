# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Nondex Check

on:
  push:
    branches: [ "trunk" ]
  pull_request:
    branches: [ "trunk" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
      
    - name: setupDependencies
      shell: bash
      run: mvn clean install -DskipTests -pl oak-auth-ldap -am
      
    - name: runRegularTest
      run: mvn -pl oak-auth-ldap test -Dtest=org.apache.jackrabbit.oak.security.authentication.ldap.LdapIdentityProviderTest#testGetDeclaredGroupsByRef2

    - name: runNondexTest
      run: mvn -pl oak-auth-ldap edu.illinois:nondex-maven-plugin:2.2.1:nondex -Dtest=org.apache.jackrabbit.oak.security.authentication.ldap.LdapIdentityProviderTest#testGetDeclaredGroupsByRef2
      
